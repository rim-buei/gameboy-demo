<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Game Boy Emulator</title>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .cartridge {
        width: 480px;
        margin: 0;
        padding: 0.75rem 0 0.75rem;
      }
      .display canvas {
        width: 480px;
        height: 432px;
        margin: 0;
        padding: 0;

        border: solid #c3c7cb;
        border-width: 1px;
      }
      .controls {
        margin: 0.75rem 0 0.75rem 0;
        padding: 0;
      }
      .controls kbd {
        background-color: #f7f7f8;
        padding: 0.0625rem 0.25rem;

        border: solid #c3c7cb;
        border-radius: 0.25rem;
        border-width: 1px 1px 2px;

        color: #51565d;
        font-family: "JetBrains Mono", monospace;
      }
      .footer {
      }
    </style>
  </head>
  <body>
    <script type="module">
      import init from "./pkg/gameboy.js";
      init();
    </script>
    <div class="container">
      <div class="cartridge">
        <span>
          Cartridge:
          <select id="select-rom">
            <option value="roms/2048.gb">2048</option>
            <option value="roms/porklike.gb">Porklike GB</option>
            <option value="roms/Wyrmhole.gb">WYRMHOLE</option>
            <option value="roms/evoland_0.3.0_en.gb">Evoland</option>
            <option value="roms/knight2.gb">Unstoppable Knight</option>
            <option value="roms/maxpirateeb.gb">Max Pirate Extra Boom</option>
            <option value="roms/dmg_test_prog_ver1.gb">Blargg's Test</option>
          </select>

          <!-- Change this input type from "hidden" to "file" if you want to load your own ROMs -->
          <input type="hidden" id="load-rom" />
        </span>
      </div>
      <div class="display">
        <canvas width="160" height="144"></canvas>
      </div>
      <div class="controls">
        <span>
          <kbd>&#8592;</kbd>
          <kbd>&#8593;</kbd>
          <kbd>&#8594;</kbd>
          <kbd>&#8595;</kbd>
          &nbsp; A: <kbd>X</kbd>
          &nbsp; B: <kbd>Z</kbd>
          &nbsp; START: <kbd>Enter</kbd>
          &nbsp; SELECT: <kbd>Space</kbd>
        </span>
      </div>
      <div class="footer">
        <a href="https://github.com/rim-buei/gameboy" target="_blank"
          ><img src="./images/github.svg" alt="GitHub" width="32" height="32"
        /></a>
      </div>
    </div>
  </body>
</html>
